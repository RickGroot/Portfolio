name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy_preview:
    needs: verify
    # Fork guard sits on the DEPLOY job only, so fork PRs are still fully
    # verified -- they just cannot reach the service-account secret.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_RICK_GROOT }}'
          projectId: portfolio-rick-groot
