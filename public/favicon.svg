<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Rick Groot">
  <title>Rick Groot</title>
  <rect width="32" height="32" rx="6" fill="#101214"/>
  <!-- Signal bars: resolves left-to-right from noise into a steady reading. -->
  <g fill="#01efac">
    <rect x="6"  y="19" width="3" height="7"  rx="1.5"/>
    <rect x="11" y="14" width="3" height="12" rx="1.5"/>
    <rect x="16" y="9"  width="3" height="17" rx="1.5"/>
    <rect x="21" y="6"  width="3" height="20" rx="1.5"/>
  </g>
</svg>
