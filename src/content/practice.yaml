# How I work: the three principles on the one-pager, in `order`.
#
# Rewritten 2026-11-24 around Rick's own brief: AI-first with a human in the
# loop; integrations that go beyond one platform; workflows that help teams of
# different disciplines. Read in order they are one story: how I work with AI,
# what I build, how it reaches the team.
#
# Each principle is a title and a body, nothing else: the separate proof lines
# went on Rick's call (2026-11-24). Parallel imperatives read as generated (the
# 2026-09-22 note on the first version), so the titles say what happens rather
# than what to do. The front types the titles on ruled lines: keep them under
# about 32 characters.
#
# Quote no count that grows with the work: "37 commits" and "105 tests" were
# both stale within a week. tests/e2e/claims.spec.ts fails on one.
#
# COPY CHECK (2026-11-24): the themes are Rick's, the sentences are drafted.
# Rewrite them in your own voice.

- id: in-the-loop
  order: 1
  title: AI drafts, I decide
  body: >-
    I work AI-first. An agent writes the first draft of the code, the tests,
    and often the question I had not thought to ask. I stay in the loop at
    every decision that matters: I choose between the options, review what
    ships, and answer for it.

- id: across-screens
  order: 2
  title: Integrations that cross screens
  body: >-
    A viewer does not think in platforms. They start on the phone, cast to the
    TV, and expect the programme, the position and the subtitles to come along.
    The work I like best lives between the screens: the cast session between a
    phone and a receiver, a player and analytics that report the same way on
    every device. I design those integrations first, so every platform plays
    its part in the same agreement.

- id: whole-team
  order: 3
  title: Workflows the whole team runs
  body: >-
    Design, QA, product and development each know something the others need. I
    write that knowledge into workflows that colleagues and agents both run, as
    rules, prompts and checks, so accessibility and performance are the default
    and good work does not depend on who is in the room.
